<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -109 449.5 150.5" width="449.5" height="150.5">
  <title>Dito</title>
  <!-- Positive lockup, for a light surface. The negative variant is the same file with three
       values swapped (glyph #8b7cff, meter #111116, wordmark #f5f5f7) — see docs/marca.md.

       The viewBox is tight to the ink, measured from a raster, so whoever places this file owns
       the clear space instead of inheriting padding baked in here.

       Layout, in cap heights (cap = 100 user units): mark 1.5 cap tall, 0.42 cap of air between
       mark and word, mark anchored on the cap band by a 70/30 blend of its body centre and its
       full-box centre — its own centre reads too high because the tail is thin. -->

  <!-- Mark: the same 24-grid glyph as icon.svg, scaled 7.6923 (= 1.5 cap / 19.5 units). -->
  <g transform="translate(-17.3077 -126.1538) scale(7.692308)">
    <path d="M 6.5 3.5 H 15 A 5.5 5.5 0 0 1 15 14.5 H 8.5 L 3.5 20.5 V 6.5 A 3 3 0 0 1 6.5 3.5 Z"
          fill="#4b3bd4" stroke="#4b3bd4" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="7.15" y="6.5" width="2.5" height="5" rx="1.25" fill="#ffffff"/>
    <rect x="11.15" y="4.5" width="2.5" height="9" rx="1.25" fill="#ffffff"/>
    <rect x="15.15" y="5.7" width="2.5" height="6.6" rx="1.25" fill="#ffffff"/>
  </g>

