<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Dito — não estou te ouvindo</title>
  <!-- The most important icon in the project: it is what appears when the microphone is not
       capturing and the person is talking to nothing.

       The speech bubble is GONE. That is deliberate and it is the whole idea of the mark: Dito is
       a bubble while it is hearing you, and when it is not, the bubble breaks into the one shape
       every person on earth reads as "problem". Round versus triangular survives 22 px, blur and
       colour blindness — a red dot next to a red bubble does not.

       Same two-tone build as the other states: #f7f7f9 keyline inside the silhouette, danger core
       on top, so it shouts on a light panel (5.15:1) and on a dark one (keyline 11.82:1). -->
  <path d="M 12 3.4 L 20.9 19.8 H 3.1 Z"
        fill="#f7f7f9" stroke="#f7f7f9" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 12 3.4 L 20.9 19.8 H 3.1 Z" fill="#c62a30"/>
  <rect x="10.75" y="9.4" width="2.5" height="5.6" rx="1.25" fill="#f7f7f9"/>
  <circle cx="12" cy="17.6" r="1.5" fill="#f7f7f9"/>
</svg>
