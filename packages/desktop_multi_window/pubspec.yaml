name: desktop_multi_window
description: Fork do plugin da Mixin, so Windows, com janela que nao rouba o foco. Ver FORK.md.
version: 0.3.0-dito.1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DesktopMultiWindowPlugin