name: defalt_updater
description: "Auto-update fora das lojas (Windows, Android e Linux/APT) para os apps Flutter do Defalt. Sem UI."
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                   # manifesto + download do asset
  crypto: ^3.0.3                 # sha256 do arquivo baixado
  path_provider: ^2.1.4          # pasta de trabalho do download
  package_info_plus: ^9.0.1      # versao instalada (base da comparacao semver)
  url_launcher: ^6.3.0             # Android: entrega o download ao navegador
  shared_preferences: ^2.3.0     # modo, throttle da checagem e "pular versao"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
