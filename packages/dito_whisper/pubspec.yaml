name: dito_whisper
description: "Motor nativo Whisper.cpp via Dart FFI para o Dito (Zero Python)."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DitoWhisperPluginCApi
      linux:
        pluginClass: DitoWhisperPlugin
