<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title data-i18n="reviewWindowTitle"></title>
<link rel="stylesheet" href="./src/theme.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Padding is what lets the shadow and the rounded corners breathe inside a transparent window. */
  body { display: grid; place-items: center; padding: 18px 22px 22px; }

  .card {
    width: 100%;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border-2);
    border-radius: 20px;
    box-shadow: 0 22px 55px rgba(0,0,0,.62), 0 1px 0 rgba(255,255,255,.05) inset;
    padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 12px;
    transform: translateY(14px) scale(.965); opacity: 0;
    transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .22s ease;
  }
  body[data-open="1"] .card { transform: translateY(0) scale(1); opacity: 1; }
  body[data-closing="1"] .card { transform: translateY(8px) scale(.98); opacity: 0; transition-duration: .16s; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .where { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where b { color: var(--text); font-weight: 500; }
  .where .pin { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--purple); margin-right: 7px; vertical-align: 1px; }


  textarea {
    width: 100%; min-height: 92px; max-height: 190px; resize: none;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font: inherit; line-height: 1.55;
    -webkit-user-select: text; user-select: text;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,124,255,.18); }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hint { color: var(--muted); font-size: 11.5px; }
  .buttons { display: flex; gap: 8px; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 6px; font: 11px/1.6 "Cascadia Mono", Consolas, monospace; color: var(--purple);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="where"><span class="pin"></span><span data-i18n="reviewGoingTo"></span> <b id="target">—</b></div>
    </div>
    <textarea id="text" spellcheck="false"></textarea>
    <div class="foot">
      <span class="hint"><kbd>Enter</kbd> <span data-i18n="reviewHintSend"></span> · <kbd>Shift+Enter</kbd> <span data-i18n="reviewHintNewline"></span> · <kbd>Tab</kbd> <span data-i18n="reviewHintDiscard"></span></span>
      <span class="buttons">
        <button class="action" id="discard" data-i18n="reviewDiscardButton"></button>
        <button class="action primary" id="send" data-i18n="reviewSendButton"></button>
      </span>
    </div>
  </div>
  <script type="module" src="./src/review.ts"></script>
</body>
</html>
