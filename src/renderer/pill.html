<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title data-i18n="appName"></title>
<link rel="stylesheet" href="./src/theme.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; line-height: 1.4; }

  .card {
    position: relative;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 24px 16px 20px; border-radius: 22px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border-2);
    box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.05) inset;
    min-width: 320px; max-width: 400px;
    transform: translateY(16px) scale(.96); opacity: 0;
    transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .22s ease;
  }
  body[data-visible="1"] .card { transform: translateY(0) scale(1); opacity: 1; }

  /* A thin accent line carries the state colour without shouting. */
  .card::before {
    content: ''; position: absolute; left: 20px; right: 20px; top: 0; height: 2px;
    border-radius: 0 0 2px 2px; background: var(--muted); opacity: .25;
    transition: background .25s ease, opacity .25s ease;
  }
  body[data-phase="recording"] .card::before { background: var(--red); opacity: .9; }
  body[data-phase="transcribing"] .card::before { background: var(--purple); opacity: .9; }
  body[data-phase="pasted"] .card::before,
  body[data-phase="copied"] .card::before,
  body[data-phase="done"] .card::before { background: var(--green); opacity: .9; }
  body[data-phase="error"] .card::before,
  body[data-silent="1"] .card::before { background: var(--red); opacity: 1; }

  .mic { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
  .mic .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--border-2);
    transition: border-color .25s ease, background .25s ease;
  }
  .mic .glyph { position: relative; width: 19px; height: 19px; color: var(--muted); transition: color .25s ease; }

  body[data-phase="recording"] .mic .disc { border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.08); }
  body[data-phase="recording"] .mic .glyph { color: var(--red); }
  body[data-phase="recording"] .mic::after {
    content: ''; position: absolute; inset: -2px; border-radius: 50%;
    border: 1.5px solid var(--red); animation: ripple 2s cubic-bezier(.22,1,.36,1) infinite;
  }
  body[data-phase="transcribing"] .mic .glyph { color: var(--purple); }
  body[data-phase="pasted"] .mic .disc,
  body[data-phase="copied"] .mic .disc,
  body[data-phase="done"] .mic .disc { border-color: rgba(74,222,128,.45); background: rgba(74,222,128,.08); }
  body[data-phase="pasted"] .mic .glyph,
  body[data-phase="copied"] .mic .glyph,
  body[data-phase="done"] .mic .glyph { color: var(--green); }
  body[data-phase="error"] .mic .disc { border-color: rgba(255,107,107,.45); }
  body[data-phase="error"] .mic .glyph { color: var(--red); }

  /* No sound arriving is a failure the user must see while it is happening, not after. */
  body[data-silent="1"] .mic .disc { border-color: rgba(255,107,107,.6); background: rgba(255,107,107,.12); }
  body[data-silent="1"] .mic .glyph { color: var(--red); }
  body[data-silent="1"] .mic::after { animation: none; opacity: 0; }

  @keyframes ripple { 0% { transform: scale(.9); opacity: .5 } 100% { transform: scale(1.28); opacity: 0 } }
  @keyframes spin { to { transform: rotate(360deg) } }

  .spinner { display: none; position: absolute; inset: -1px; }
  body[data-phase="transcribing"] .spinner { display: block; }
  .spinner circle { fill: none; stroke-width: 2; }
  .spinner .track { stroke: var(--border-2); }
  .spinner .head { stroke: var(--purple); stroke-linecap: round; stroke-dasharray: 30 110; transform-origin: 50% 50%; animation: spin 1s linear infinite; }

  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; letter-spacing: -.01em; font-size: 14.5px; }
  body[data-silent="1"] .title, body[data-phase="error"] .title { color: var(--red); }
  .phrase {
    color: var(--text); font-size: 12.5px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .phrase:empty { display: none; }

  /* Bars grow from the middle in both directions: reads as sound, not as a loading bar. */
  .wave { display: none; align-items: center; gap: 2px; height: 24px; margin-top: 7px; }
  body[data-phase="recording"] .wave { display: flex; }
  .wave i {
    width: 2.5px; height: 3px; border-radius: 2px; flex: none;
    background: linear-gradient(180deg, var(--purple), var(--purple-2));
    transition: height .1s cubic-bezier(.22,1,.36,1), opacity .2s ease;
  }
  body[data-silent="1"] .wave i { background: var(--red); opacity: .55; }
</style>
</head>
<body>
  <div class="card">
    <div class="mic">
      <span class="disc"></span>
      <svg class="spinner" viewBox="0 0 46 46"><circle class="track" cx="23" cy="23" r="21"/><circle class="head" cx="23" cy="23" r="21"/></svg>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3"/>
      </svg>
    </div>
    <div class="body">
      <div class="title" id="title" data-i18n="appName"></div>
      <div class="phrase" id="phrase"></div>
      <div class="wave" id="wave"></div>
    </div>
  </div>
  <script type="module" src="./src/pill.ts"></script>
</body>
</html>
