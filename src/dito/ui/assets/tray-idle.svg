<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Dito — parado</title>
  <!-- Drawn for 22 px, not shrunk from a large drawing.

       Two tones, and that is the whole trick: a panel can be light or dark and this file cannot
       know which. The #6b6b7a core carries the icon on a light panel (4.85:1 / 3.84:1) and the
       #f7f7f9 keyline carries it on a dark one (11.82:1 / 16.69:1). No single flat colour clears
       3:1 on both — measured, see docs/marca.md.

       Hollow on purpose: idle is the quiet state, and the empty bubble is also what tells it
       apart from `recording` by SHAPE alone, without relying on colour. The level meter appears
       only when there is a level to show. -->
  <path d="M 6.5 3.5 H 15 A 5.5 5.5 0 0 1 15 14.5 H 8.5 L 3.5 20.5 V 6.5 A 3 3 0 0 1 6.5 3.5 Z"
        fill="none" stroke="#f7f7f9" stroke-width="3.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 6.5 3.5 H 15 A 5.5 5.5 0 0 1 15 14.5 H 8.5 L 3.5 20.5 V 6.5 A 3 3 0 0 1 6.5 3.5 Z"
        fill="none" stroke="#6b6b7a" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
