name: Release Dito

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libayatana-appindicator3-dev libpulse-dev \
            libasound2-dev liblzma-dev dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags "live,golden"

      - name: Build Linux Release Package
        run: |
          bash packaging/linux/construir.sh

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux/installer/*.deb
            build/linux/installer/*.tar.gz
            build/linux/installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows (.exe setup & .zip)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags "live,golden"

      - name: Build Windows Release Package
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\construir.ps1 -SemPortao

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/installer/*.exe
            build/windows/installer/*.zip
            build/windows/installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
