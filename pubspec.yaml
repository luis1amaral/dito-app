name: dito_app
description: "Ditado por voz 100% offline com transcricao nativa Whisper C++."
publish_to: 'none'
version: 1.4.5+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter_localizations:
    sdk: flutter
  intl: any
  defalt_updater:
    path: ../../defalt_updater
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  toml: ^0.18.0
  window_manager: ^0.5.2
  flutter_dotenv: ^5.2.1
  win32: ^5.15.0
  # Fork local: a janela do HUD nao pode roubar o foco. Ver packages/desktop_multi_window/FORK.md
  desktop_multi_window:
    path: packages/desktop_multi_window
  dito_win32:
    path: packages/dito_win32
  dito_whisper:
    path: packages/dito_whisper
  package_info_plus: ^9.0.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icons/
