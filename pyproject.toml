[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dito"
version = "0.3.10"
description = "Ditado por voz offline: fale, e o texto aparece onde o cursor está"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Luis Amaral", email = "lluispaulop@gmail.com" }]

# As versoes sao TETO-ABERTO de proposito. A venv e criada com --system-site-packages e alguns
# destes pacotes vem do apt do Debian (python3-numpy, python3-av, python3-pynput,
# python3-pyperclip, python3-xlib); com o piso frouxo o pip reconhece o que o apt ja instalou e
# NAO baixa de novo. PySide6 nao esta mais nessa lista: qt6-svg-plugins e python3-pyside6.* so
# existem a partir do Ubuntu 25.10, entao PySide6 (e onnxruntime, dependencia do faster-whisper)
# vem do pip em toda distro, sempre — ver packaging/deb/README.md.
dependencies = [
    "faster-whisper>=1.1",   # PyPI: nao existe no apt
    "sounddevice>=0.5",      # PyPI: nao existe no apt
    "tomli-w>=1.0",
    "numpy>=2",
    "PySide6>=6.8",
    "pynput>=1.8",
    "pyperclip>=1.8",
    "python-xlib>=0.33; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dito = "dito.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dito = ["ui/assets/**/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # These inject real keystrokes through XTest. Global for a fraction of a second, so they are
    # skippable with `-m "not x11"` when someone is typing.
    "x11: precisa de um servidor X ativo e injeta teclas de verdade",
]
